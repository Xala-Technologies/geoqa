# The UI is its own package, and that is deliberate rather than incidental.
#
# It keeps React, Vite and the DOM lib out of the engine's dependency tree and out of its
# tsconfig — the engine is a Node CLI and nothing in `src/` should be able to import a
# component by accident. It also keeps `ui/` outside `coverage.include: ["src/**/*.ts"]`
# without needing an exclusion entry, so the 100% gate stays about the engine.
packages:
  - "ui"
