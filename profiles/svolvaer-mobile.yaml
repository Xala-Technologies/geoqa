# Lofoten's harbour town on a phone. A Norway geo-fence that only lists mainland cities drops the fishing-tourism capital of the archipelago — the hole a visitor in Svolvær reads as "this product is for people in Oslo".
id: svolvaer-mobile
label: Svolvær, mobile
market:
  id: svolvaer
  country: NO
  city: Svolvaer
  language: nb-NO
  timezone: Europe/Oslo
  currency: NOK
  coordinates: [68.2336, 14.568]
device:
  id: mobile
  kind: mobile
  viewport: { width: 390, height: 844 }
  # A real mobile identity WITHOUT a device descriptor — see `oslo-mobile.yaml` for the
  # measurement. `isMobile` is the only descriptor option that costs viewport control
  # (980 vs 390 on a page with no viewport meta tag), and it is the one not set here.
  userAgent: "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"
  hasTouch: true
  deviceScaleFactor: 3
visitorType: anonymous
