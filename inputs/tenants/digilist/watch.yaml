# Operator-controlled watch. The console writes this file; do not put credentials here.
# Markets must be ones the tenant listed. A writes journey needs allowWrites: true.
#
# Hourly VPS pulse: 34 cities × 2 URLs × 1 seeded journey = 68 runs/hour.
# The draw is UTC-hour + market + url — not Math.random(). contact-form /
# explore stay off until allowWrites is on. returning-visitor is off the
# pool (audit 2026-08-18 §2): it needs a restored session and a returning
# desktop profile; every watch cell is mobile + agent-browser + anonymous,
# so a fifth of the pulse would file fabricated high/functional defects.
# xala.no and dev.digilist.no are daily, not hourly.
# Paused 2026-08-18: Decodo returns 407 on CONNECT.
tenantId: digilist
enabled: false
mode: periodic
everyMinutes: 60
restSeconds: 60
markets:
  - oslo
  - bergen
  - trondheim
  - stavanger
  - tromso
  - bodo
  - alesund
  - kristiansand
  - arendal
  - porsgrunn
  - sarpsborg
  - drammen
  - fredrikstad
  - sandnes
  - skien
  - tonsberg
  - haugesund
  - sandefjord
  - lillehammer
  - hamar
  - molde
  - harstad
  - alta
  - narvik
  - kongsberg
  - svolvaer
  - moss
  - asker
  - lorenskog
  - sandvika
  - horten
  - steinkjer
  - lillestrom
  - sola
devices:
  - mobile
journeys:
  - landing-page
  - browse
  - search
  - reader
targets:
  - https://digilist.no
  - https://app.digilist.no
maxConcurrent: 2
allowWrites: false
journeyPick: seeded
