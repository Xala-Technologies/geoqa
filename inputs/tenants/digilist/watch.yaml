# Operator-controlled watch. The console writes this file; do not put credentials here.
# Markets must be ones the tenant listed. A writes journey needs allowWrites: true.
#
# Hourly VPS pulse: 26 cities × 2 URLs × 1 seeded journey = 52 runs/hour.
# The draw is UTC-hour + market + url — not Math.random(). contact-form /
# explore stay off until allowWrites is on. xala.no and dev.digilist.no are
# daily, not hourly. Left disarmed until Decodo + quota are ready.
tenantId: digilist
enabled: false
mode: periodic
everyMinutes: 60
restSeconds: 60
markets:
  - oslo
  - bergen
  - trondheim
  - stavanger
  - tromso
  - svolvaer
  - drammen
  - fredrikstad
  - sandnes
  - skien
  - tonsberg
  - haugesund
  - sandefjord
  - arendal
  - kristiansand
  - alesund
  - bodo
  - porsgrunn
  - lillehammer
  - harstad
  - alta
  - narvik
  - kongsberg
  - hamar
  - sarpsborg
  - molde
devices:
  - mobile
journeys:
  - landing-page
  - browse
  - search
  - reader
  - returning-visitor
targets:
  - https://digilist.no
  - https://app.digilist.no
maxConcurrent: 2
allowWrites: false
journeyPick: seeded
