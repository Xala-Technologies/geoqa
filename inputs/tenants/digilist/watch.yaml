# Operator-controlled watch. The console writes this file; do not put credentials here.
# Markets must be ones the tenant listed. A writes journey needs allowWrites: true.
#
# 34 cities × 3 URLs × desktop × 1 seeded journey = 102 cells. Hourly that is 2,448
# runs/day and ~73 GB/month against a 50 GB Decodo account, so the tick is
# 180 minutes (8 sweeps/day → 816 runs, ~24 GB). The draw is UTC-hour +
# market + url — not Math.random(). contact-form / explore stay off until
# allowWrites is on. returning-visitor is off the pool (audit 2026-08-18 §2).
# dev.digilist.no stays off this pulse (staging).
tenantId: digilist
enabled: true
mode: periodic
everyMinutes: 180
restSeconds: 60
markets:
  - oslo
  - bergen
  - trondheim
  - stavanger
  - tromso
  - bodo
  - alesund
  - kristiansand
  - arendal
  - porsgrunn
  - sarpsborg
  - drammen
  - fredrikstad
  - sandnes
  - skien
  - tonsberg
  - haugesund
  - sandefjord
  - lillehammer
  - hamar
  - molde
  - harstad
  - alta
  - narvik
  - kongsberg
  - svolvaer
  - moss
  - asker
  - lorenskog
  - sandvika
  - horten
  - steinkjer
  - lillestrom
  - sola
devices:
  - desktop
journeys:
  - landing-page
  - browse
  - search
  - reader
targets:
  - https://digilist.no
  - https://app.digilist.no
  - https://xala.no
maxConcurrent: 2
allowWrites: false
journeyPick: seeded
