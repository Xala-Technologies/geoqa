# Operator-controlled watch. The console writes this file; do not put credentials here.
# Markets must be ones the tenant listed. A writes journey needs allowWrites: true.
#
# 34 cities × 4 URLs × desktop × 1 seeded journey = 136 cells. Hourly that is
# 3,264 runs/day and ~98 GB/month against a 50 GB Decodo account, so the tick
# is 240 minutes (6 sweeps/day → 816 runs, ~24 GB) — same daily volume as the
# previous 180-minute / 3-URL pulse. Dashboard is a fourth URL, not a
# fourth marketing site: targetJourneys pins it to login-reachable so
# browse/search never run against /login. The OTP login is an e2e
# journey — one Oslo desktop cell on its own 720-minute clock, not
# 34 cities and not the pulse interval. The draw is UTC-hour + market
# + url — not Math.random(). contact-form / explore stay off until
# allowWrites is on. returning-visitor is off the pool
# (audit 2026-08-18 §2). dev.digilist.no stays off this pulse (staging).
tenantId: digilist
enabled: true
mode: periodic
everyMinutes: 240
restSeconds: 60
markets:
  - oslo
  - bergen
  - trondheim
  - stavanger
  - tromso
  - bodo
  - alesund
  - kristiansand
  - arendal
  - porsgrunn
  - sarpsborg
  - drammen
  - fredrikstad
  - sandnes
  - skien
  - tonsberg
  - haugesund
  - sandefjord
  - lillehammer
  - hamar
  - molde
  - harstad
  - alta
  - narvik
  - kongsberg
  - svolvaer
  - moss
  - asker
  - lorenskog
  - sandvika
  - horten
  - steinkjer
  - lillestrom
  - sola
devices:
  - desktop
journeys:
  - landing-page
  - browse
  - search
  - reader
targets:
  - https://digilist.no
  - https://app.digilist.no
  - https://xala.no
  - https://dashboard.digilist.no/login
targetJourneys:
  https://dashboard.digilist.no/login:
    - login-reachable
maxConcurrent: 2
allowWrites: false
journeyPick: seeded
e2e:
  everyMinutes: 720
  journeys:
    - market: oslo
      device: desktop
      journey: login
      url: https://dashboard.digilist.no/login
