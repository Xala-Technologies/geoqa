# Tenant zero: the target geoqa is tested against, not the shape of the product.
#
# Everything specific to digilist lives HERE rather than in the engine, which is the
# whole point of the file existing. When tenant two arrives, nothing in src/ should
# need to know.
id: digilist
name: Digilist AS
# Profile market ids, not free text. A run for a market this tenant never asked
# about is refused, which matters once quota is real: a typo that sweeps 16 markets
# instead of 3 is a bill.
markets:
  [
    oslo,
    bergen,
    trondheim,
    stavanger,
    tromso,
    bodo,
    alesund,
    kristiansand,
    arendal,
    porsgrunn,
    sarpsborg,
    drammen,
    fredrikstad,
    sandnes,
    skien,
    tonsberg,
    haugesund,
    sandefjord,
    lillehammer,
    hamar,
    molde,
    harstad,
    alta,
    narvik,
    kongsberg,
    svolvaer,
    moss,
    asker,
    lorenskog,
    sandvika,
    horten,
    steinkjer,
    lillestrom,
    sola,
  ]
# An allowlist, and it is a security control rather than convenience. This engine
# drives a real browser from residential IPs on a schedule; a target it was not
# pointed at deliberately is either a mistake or somebody else's site.
targets:
  - https://digilist.no
  - https://app.digilist.no
  - https://dev.digilist.no
  - https://dashboard.digilist.no
  - https://xala.no
# Host → GitHub repo. Site findings file here; instrumentation stays on
# GEOQA_GITHUB_REPO. app.digilist.no PRs start from `dev`.
repositories:
  - host: digilist.no
    repo: Xala-Technologies/booking-brilliance
    base: main
  - host: app.digilist.no
    repo: Xala-Technologies/Digilist
    base: dev
  - host: dashboard.digilist.no
    repo: Xala-Technologies/Digilist
    base: dev
  - host: xala.no
    repo: xalatechnologies/xala-web-cloner
    base: main
# The NAME of an environment variable, never a credential. R-26: credentials come
# from the environment only. null means "use the shared default", which is what this
# tenant does today — its own Decodo sub-user is slice 7.
proxyCredentials: null
# The NAME of the variable holding this tenant's proxy sub-account username, for
# metering. Also a name: a sub-account username is half a credential pair and
# identifies a billable account. Set GEOQA_SUBUSER_DIGILIST to meter this tenant;
# until then its traffic is UNMEASURABLE rather than unlimited, because the shared
# account's figure describes every tenant on it.
proxySubUser: GEOQA_SUBUSER_DIGILIST
quota:
  # Sized for the 180-minute pulse: 34 cities × 3 URLs × desktop × 1 journey = 102
  # cells × 8 sweeps/day = 816 runs, plus 2 Oslo-desktop extras (login-reachable
  # + login) × 8 = 16. 1,800 leaves headroom for a console "Run now". Traffic is
  # 1 MB × 832 × 30 days ≈ 25 GB against a 50 GB account. Hourly on three sites
  # would be 2,448/day and ~73 GB — over the account — so the tick is 180
  # minutes on purpose.
  trafficMb: 50000
  runsPerDay: 1800
retentionDays: 30
