# Nearest neighbour market. Exists to catch the classic failure: Norwegian
# content served to a Swedish visitor, or a currency that never switches.
id: stockholm-mobile
label: Stockholm, mobile
market:
  id: stockholm
  country: SE
  city: Stockholm
  language: sv-SE
  timezone: Europe/Stockholm
  currency: SEK
  coordinates: [59.3293, 18.0686]
device:
  id: mobile
  kind: mobile
  viewport: { width: 390, height: 844 }
  # No `emulate:` — deliberately, and measured rather than assumed.
  #
  # A Playwright device descriptor sets Chromium's `isMobile`, which introduces a
  # LAYOUT viewport: a page without `<meta name="viewport">` then reports
  # window.innerWidth 980 however small the window is (980 vs 390 at the same
  # 390x844 window, and visualViewport tracks innerWidth exactly, so there is no
  # page-independent reading).
  #
  # `observeBrowser` reads the viewport on the identity-probe page, before the
  # journey opens the target — so under emulation the viewport axis would measure
  # the PROBE page's markup rather than the profile. That axis exists because a
  # mobile profile once rendered at 1280px while every other check passed, so
  # trading it for a nicer user agent is the wrong way round.
  #
  # The cost that used to be recorded here — "these runs advertise a headless user
  # agent" — is now paid, and NOT by restoring `emulate`. Measured against a page
  # with no viewport meta tag:
  #
  #   context                            innerWidth  touch  mobile UA
  #   viewport only (the old state)      390         0      no
  #   viewport + userAgent + hasTouch    390         1      yes
  #   full `Pixel 5` descriptor          980         1      yes
  #
  # Playwright treats `isMobile`, `hasTouch`, `deviceScaleFactor` and `userAgent` as
  # INDEPENDENT context options, and only `isMobile` introduces the layout viewport.
  # So the choice gaps C-8 framed — emulation or a hand-maintained UA — was a false
  # one: this presents a real mobile identity to UA and touch detection while
  # `window.innerWidth` stays exactly what this profile declares.
  #
  # The user agent is written out rather than taken from Playwright's own descriptor,
  # which is version-synced with the shipped browser and would never go stale. That is
  # deliberate: a profile is a DECLARATION of a test subject, and one that changed
  # under you with a dependency upgrade would make yesterday's run and today's run
  # different subjects wearing the same name — the same reason a RunSpec carries its
  # seed. A real Android device in the wild lags the newest Chrome anyway.
  userAgent: "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"
  hasTouch: true
  # 3 is a Pixel-class ratio. It changes which `srcset` candidate a page picks, and
  # nothing else — the viewport stays 390 because `isMobile` is not set.
  deviceScaleFactor: 3
visitorType: anonymous
